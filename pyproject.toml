[project]
name = "reel"
version = "1.0.0"
description = "Process lecture recordings into privacy-aware lessons."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Gevorg Melkonyan" }]

[project.urls]
Homepage = "https://github.com/3melkonyan/ReelProject"
Repository = "https://github.com/3melkonyan/ReelProject"
Issues = "https://github.com/3melkonyan/ReelProject/issues"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
# Ruff's formatter splits compound statements and wraps code. Long strings and embedded
# JavaScript fixtures may exceed the width; format checking owns these layout rules.
ignore = ["E501", "E701", "E702"]

[tool.ruff.lint.per-file-ignores]
# Route modules are registered after the shared environment and helpers are initialized.
"reel/web/app.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency declarations are immutable framework metadata.
extend-immutable-calls = ["fastapi.Depends", "Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
