name: Core checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REEL_DRY_RUN: "1"
      REEL_STUDENT_MAIL_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate the example configuration
        run: python -m reel.config --smoke
      - name: Check Python syntax
        run: python -m compileall -q reel
      - name: Test queue, configuration and privacy decisions
        run: >-
          python -m pytest -q
          tests/test_cli_inputs.py
          tests/test_encoding.py
          tests/test_preview_progress.py
          tests/test_pipeline.py
          tests/test_config_v2.py
          tests/test_google_auth.py
          tests/test_privacy_guard.py
          tests/test_blur_decisions_size.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install formatting tools
        run: |
          python -m pip install ruff==0.14.6
          npm ci --ignore-scripts
      - name: Check Python style
        run: |
          ruff check .
          ruff format --check .
      - name: Check frontend style
        run: npm run format:check

  full-tests:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      REEL_DRY_RUN: "1"
      REEL_STUDENT_MAIL_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install media tools
        run: brew install ffmpeg
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run the full suite
        run: python -m pytest -q -p no:cacheprovider
