name: Feature request
description: Suggest a change to the lecture workflow.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What task is difficult today, and who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the result you need and any alternatives you considered.
    validations:
      required: true
