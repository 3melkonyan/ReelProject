name: Bug report
description: Report a reproducible problem using synthetic or redacted data.
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the actual result and what you expected. Do not include credentials or student data.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal synthetic example, the affected stage and relevant redacted logs.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version, Mac chip, Python version and commit.
    validations:
      required: true
